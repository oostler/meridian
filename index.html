<noscript><main style="font:16px/1.5 system-ui;padding:24px;max-width:640px;margin:auto">
<h1>Meridian: learn world geography and history</h1>
<p>Learn every country, capital, US state, Canadian province and Chinese province on a 3D globe, then see the history that shaped them: empires, wars and revolutions, from the first cities to today. Free, with quizzes and offline play.</p>
<h2>What you can learn</h2>
<ul><li>All 197 countries, their capitals and flags, by continent</li><li>The 50 US states, Canada's provinces and territories, China's provinces, and the five oceans</li>
<li>A timeline of world history on the map: the first civilisations, Rome, the Silk Road, the Mongols, the age of empires, the world wars, the Cold War and the world today</li>
<li>The history of the United States, China and Canada, state by state</li><li>Quizzes: multiple choice, typing and finding places on the globe</li></ul>
<p>Meridian needs JavaScript to show the globe.</p></main></noscript>

<style>
/* Meridian: a full-bleed globe, a header of chips, and a panel above a tab bar.
   Flat colour, chunky tactile buttons (a darker "edge" below each), a rounded bold typeface. */
:root {
  --bg: #ffffff; --surface: #f7f7f7; --ink: #3c3c3c; --ink-2: #777777; --ink-3: #afafaf; --line: #e5e5e5;
  --green: #58cc02; --green-d: #58a700; --green-l: #d7ffb8;
  --blue: #1cb0f6; --blue-d: #1899d6; --blue-l: #ddf4ff;
  --red: #ff4b4b; --red-d: #ea2b2b; --red-l: #ffdfe0;
  --gold: #ffc800; --gold-d: #e5a400; --gold-l: #fff5d3;
  --orange: #ff9600; --purple: #ce82ff; --purple-d: #a560e8;
  /* a soft sky with a few faint stars behind the globe */
  --stars: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><circle cx='84' cy='39' r='1.5' fill='%23fff' opacity='0.35'/><circle cx='19' cy='139' r='0.8' fill='%23fff' opacity='0.9'/><circle cx='15' cy='132' r='0.6' fill='%23fff' opacity='0.35'/><circle cx='113' cy='18' r='0.6' fill='%23fff' opacity='0.9'/><circle cx='110' cy='215' r='0.6' fill='%23fff' opacity='0.5'/><circle cx='164' cy='152' r='0.6' fill='%23fff' opacity='0.9'/><circle cx='152' cy='13' r='0.8' fill='%23fff' opacity='0.35'/><circle cx='145' cy='35' r='1' fill='%23fff' opacity='0.5'/><circle cx='141' cy='148' r='1.2' fill='%23fff' opacity='0.5'/><circle cx='27' cy='149' r='0.8' fill='%23fff' opacity='0.6'/><circle cx='25' cy='185' r='1.2' fill='%23fff' opacity='0.35'/><circle cx='161' cy='129' r='1.2' fill='%23fff' opacity='0.8'/><circle cx='202' cy='121' r='1' fill='%23fff' opacity='0.6'/><circle cx='78' cy='207' r='1.5' fill='%23fff' opacity='0.5'/><circle cx='21' cy='78' r='1' fill='%23fff' opacity='0.6'/><circle cx='190' cy='75' r='0.6' fill='%23fff' opacity='0.35'/><circle cx='133' cy='43' r='0.8' fill='%23fff' opacity='0.5'/><circle cx='243' cy='110' r='1.5' fill='%23fff' opacity='0.35'/><circle cx='199' cy='149' r='0.8' fill='%23fff' opacity='0.6'/><circle cx='181' cy='155' r='1.2' fill='%23fff' opacity='0.8'/><circle cx='18' cy='24' r='0.8' fill='%23fff' opacity='0.8'/><circle cx='181' cy='17' r='1.5' fill='%23fff' opacity='0.6'/></svg>");
  --space: var(--stars), radial-gradient(120% 90% at 50% 38%, #f6fbff 0%, #deeefa 50%, #c3dff3 100%);
  /* read by the globe */
  --ocean: #bcd6e2; --land: #f3f5ef; --border: #6f858e; --m1: #d7ffb8; --m2: #89e219; --target: #ffc800; --target-ink: #3c2a00;
  --good: #58cc02; --bad: #ff4b4b; --label: #1d3640; --halo: rgba(243, 245, 239, .9); --veil: #3d4f58;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .9, .25, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131f24; --surface: #1a2a31; --ink: #f1f7fb; --ink-2: #a5b6bf; --ink-3: #52656d; --line: #37464f;
    --green-l: #2b4a12; --blue-l: #13394d; --red-l: #4a1d20; --gold-l: #3d3315;
    --space: var(--stars), radial-gradient(120% 90% at 50% 40%, #1b3a52 0%, #0f2232 55%, #08111b 100%);
    --land: #2b3b43; --m1: #2f5a3b; --m2: #4f9b2a; --veil: #000000; --label: #e3edf0; --halo: rgba(16, 41, 58, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131f24; --surface: #1a2a31; --ink: #f1f7fb; --ink-2: #a5b6bf; --ink-3: #52656d; --line: #37464f;
  --green-l: #2b4a12; --blue-l: #13394d; --red-l: #4a1d20; --gold-l: #3d3315;
  --space: var(--stars), radial-gradient(120% 90% at 50% 40%, #1b3a52 0%, #0f2232 55%, #08111b 100%);
  --land: #2b3b43; --m1: #2f5a3b; --m2: #4f9b2a; --veil: #000000; --label: #e3edf0; --halo: rgba(16, 41, 58, .85);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; margin: 0; }
body { background: var(--space); color: var(--ink); font: 700 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; display: block; }

/* A tactile surface: white, 2px rim, a thicker rim below that disappears when pressed. */
.tile { background: var(--bg); border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 3px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.tile:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }

/* ---- layout ---- */
#app { position: fixed; left: 0; right: 0; top: 0; height: 100%; overflow: hidden; }
#mapwrap { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: var(--space); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Header: what you're learning (tap to change), your streak, how many you've mastered. */
#top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3; }
#top > * { pointer-events: auto; }
.spacer { flex: 1; }
#scopeBtn { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 12px 0 8px; min-width: 0; max-width: calc(100% - 150px); }
#scopeBtn .sb-icon { font-size: 24px; line-height: 1; flex: none; }
#scopeBtn .sb-text { display: grid; text-align: left; line-height: 1.05; min-width: 0; }
#scopeBtn b { font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#scopeBtn small { font-size: 12px; font-weight: 800; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#scopeBtn .chev { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.hstat { display: flex; align-items: center; gap: 5px; height: 46px; padding: 0 12px; font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; }
.hstat .ic { width: 24px; height: 24px; }
#streakBtn { color: var(--orange); }
#streakBtn.off { color: var(--ink-3); }
#ringBtn { color: var(--blue); }
#ringBtn small { font-size: 12px; color: var(--ink-3); font-weight: 800; margin-left: -2px; }

/* Map buttons. */
#ctrls { position: absolute; right: 12px; bottom: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 3; }
#ctrls .grp { display: flex; flex-direction: column; gap: 10px; }
#ctrls button { width: 46px; height: 46px; display: grid; place-items: center; color: var(--ink-2); padding: 0; }
#ctrls button[hidden] { display: none; }
#ctrls #zbase[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); box-shadow: 0 3px 0 var(--blue-d); }
.maplibregl-ctrl-attrib { font-size: 10px; font-family: system-ui, sans-serif; font-weight: 400; }

#toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 68px); transform: translate(-50%, -6px); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 800; opacity: 0; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; z-index: 5; }
.report { position: absolute; inset: 0; z-index: 8; background: rgb(0 0 0 / .35); display: grid; align-items: start; justify-items: center; padding: calc(env(safe-area-inset-top, 0px) + 64px) 16px 16px; animation: fade .2s; }
.report[hidden] { display: none; }
.rcard { width: min(440px, 100%); background: var(--bg); border-radius: 20px; padding: 18px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgb(0 0 0 / .25); }
.rtitle { font-size: 20px; font-weight: 900; }
.rwhere { font-size: 13px; font-weight: 800; color: var(--ink-2); }
#rText { font: 600 16px/1.4 var(--font); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; resize: none; -webkit-user-select: text; user-select: text; }
#rText:focus { outline: none; border-color: var(--blue); }
.rnote { margin: 0; font-size: 12px; color: var(--ink-3); font-weight: 800; }
.rbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flag { justify-self: start; border: 0; background: none; padding: 2px 0; font: 800 13px var(--font); color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
@keyframes fade { from { opacity: 0; } }
#brand { display: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.wrap { white-space: normal; width: max-content; max-width: min(360px, calc(100% - 32px)); border-radius: 16px; text-align: center; line-height: 1.3; }

/* ---- panel and tab bar ---- */
#sheet { background: var(--bg); border-radius: 24px 24px 0 0; padding: 0 16px 16px; box-shadow: 0 -2px 0 var(--line), 0 -10px 30px rgba(0, 0, 0, .06);
  position: absolute; left: 0; right: 0; bottom: var(--tabs-h, 0px); z-index: 4; max-height: 62%; overflow-y: auto; overscroll-behavior: contain;
  transition: height .32s var(--ease); -webkit-user-select: text; user-select: text; }
#sheet.sized { max-height: none; }
#sheet.dragging { transition: none; }
.handle { position: sticky; top: 0; z-index: 2; display: block; width: calc(100% + 32px); height: 24px; margin: 0 -16px 4px; border: 0; padding: 0; background: var(--bg); cursor: grab; touch-action: none; }
.handle::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 9px auto 0; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

#tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: var(--bg); border-top: 2px solid var(--line); transition: transform .3s var(--ease); }
#tabs button { border: 2px solid transparent; border-radius: 14px; background: none; display: grid; justify-items: center; gap: 2px; padding: 5px 0 4px; color: var(--ink-3); font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
#tabs button svg { width: 30px; height: 30px; filter: grayscale(1); opacity: .55; transition: transform .2s var(--ease); }
#tabs button[aria-selected="true"] { border-color: color-mix(in srgb, var(--tc) 55%, transparent); background: color-mix(in srgb, var(--tc) 13%, var(--bg)); color: var(--tc); }
#tabs button[aria-selected="true"] svg { filter: none; opacity: 1; transform: scale(1.06); }
body.in-round #tabs { transform: translateY(110%); pointer-events: none; }

/* ---- type and controls ---- */
h1, h2, h3 { margin: 0; }
.title { font-weight: 900; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; }
.label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 900; }
.hint { font-size: 15px; color: var(--ink-2); margin: 0; font-weight: 700; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.btn { border: 2px solid var(--line); border-radius: 16px; min-height: 50px; padding: 10px 16px; font-weight: 900; font-size: 15px; letter-spacing: .07em; text-transform: uppercase;
  background: var(--bg); color: var(--blue); box-shadow: 0 4px 0 var(--line); display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; transition: transform .08s, box-shadow .08s, filter .15s; margin-bottom: 4px; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-d); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-d); }
.btn.ghost { border-color: transparent; box-shadow: none; color: var(--ink-3); }
.btn:hover { filter: brightness(1.04); }
.btn:disabled { background: var(--line); border-color: var(--line); color: var(--ink-3); box-shadow: 0 4px 0 var(--line); filter: none; }
.btn .ic { width: 22px; height: 22px; }
.link { border: 0; background: none; padding: 6px 0; color: var(--blue); font-size: 14px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.link.quiet { color: var(--ink-3); }
/* Subject toggle */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.seg button { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 9px 6px; font-size: 15px; font-weight: 900; color: var(--ink-2); box-shadow: 0 3px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.seg button:active { transform: translateY(3px); box-shadow: none; }
.seg button[aria-pressed="true"] { border-color: #84d8ff; background: var(--blue-l); color: var(--blue); box-shadow: 0 3px 0 #84d8ff; }

/* ---- explore ---- */
.search { position: relative; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: 17px; font-weight: 800; padding: 12px 40px 12px 42px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--ink-3); font-weight: 800; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search input:focus, .search input:focus-visible { outline: none; border-color: var(--blue); background: var(--bg); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--ink-3); width: 32px; height: 32px; display: none; place-items: center; }
.search.has-text .clear { display: grid; }
.results { display: grid; gap: 8px; }
.result { display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-align: left; }
.result .r-fl { font-size: 28px; line-height: 1; width: 34px; text-align: center; flex: none; }
.result b { display: block; font-weight: 900; font-size: 16px; }
.result small { color: var(--ink-2); font-size: 13px; font-weight: 700; }
.home-h { margin: 6px 0 -4px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.go, .pod { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; }
.go-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--bg)); color: var(--c); }
.go-ic .ic { width: 24px; height: 24px; }
.go b, .pod b { display: block; font-size: 16px; font-weight: 900; line-height: 1.2; }
.go small, .pod small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 700; line-height: 1.35; }
.go > .ic { width: 18px; height: 18px; color: var(--ink-3); }
.pod { grid-template-columns: auto 1fr; }
.pod .flag { font-size: 34px; line-height: 1; }
.pod small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.empty .em-ic { grid-row: span 2; width: 58px; height: 58px; }
.empty .em-ic svg { width: 100%; height: 100%; }
.empty b { font-weight: 900; font-size: 19px; line-height: 1.15; }
.empty p { margin: 0; color: var(--ink-2); font-size: 15px; }

.place { display: grid; grid-template-columns: auto 1fr auto; gap: 0 14px; align-items: center; }
.place .flag { font-size: 40px; line-height: 1; grid-row: span 2; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; border: 2px solid var(--line); background: var(--bg); }
.place .flag.sea { background: var(--blue-l); border-color: #84d8ff; }
.place h2 { font-weight: 900; font-size: 26px; line-height: 1.08; text-wrap: balance; }
.place .sub { font-size: 15px; color: var(--ink-2); grid-column: 2; font-weight: 800; }
.place .x { border: 0; background: none; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-3); align-self: start; grid-row: 1; grid-column: 3; }
.place .x .ic { width: 20px; height: 20px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.fact { border: 2px solid var(--line); border-radius: 16px; padding: 9px 12px; min-width: 0; }
.fact span { display: block; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 900; }
.fact b { display: block; font-weight: 900; font-size: 17px; line-height: 1.2; margin-top: 2px; overflow-wrap: anywhere; }
.status { display: flex; gap: 8px; flex-wrap: wrap; }
.status span { font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 10px; border: 2px solid var(--line); color: var(--ink-3); }
.status span.s1 { border-color: var(--gold); background: var(--gold-l); color: var(--gold-d); }
.status span.s2 { border-color: var(--green); background: var(--green-l); color: var(--green-d); }

/* Story */
.story { display: grid; gap: 8px; font-size: 16px; line-height: 1.55; font-weight: 600; }
.story p { margin: 0; }
.hq { gap: 12px; }
.hq .opts { display: grid; gap: 8px; }
.hq .verdict { position: static; margin: 0; border-radius: 14px; padding: 14px; }
.hopt { display: flex; align-items: center; gap: 10px; text-align: left; }
.hopt i { flex: none; width: 14px; height: 14px; border-radius: 4px; }
.hopt.right { border-color: var(--green); background: var(--green-l); }
.hopt.wrong { border-color: var(--red); background: var(--red-l); }
.hopt.dim { opacity: .5; }
#hqGo { display: flex; align-items: center; justify-content: center; gap: 8px; }
#hqGo .ic { width: 20px; height: 20px; }
.tl { display: grid; gap: 6px; }
.tlrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 2px solid var(--line); border-left: 5px solid var(--sc); background: var(--bg); border-radius: 12px; padding: 8px 10px; color: var(--ink); font: inherit; }
.tlrow:active { transform: translateY(2px); }
.tlrow i { width: 12px; height: 12px; border-radius: 4px; }
.tlrow b { display: block; font-size: 14px; font-weight: 900; line-height: 1.25; }
.tlrow small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 800; line-height: 1.3; }
.tlrow .ic { width: 16px; height: 16px; color: var(--ink-3); }
.tl details { display: grid; gap: 6px; }
.tl details[open] { display: grid; }
.tl details > .tlrow { margin-top: 6px; }
.tl summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 900; color: var(--blue-d); padding: 4px 2px; }
.tl summary::-webkit-details-marker { display: none; }
.story h4 { margin: 8px 0 -2px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 900; }
.eras { display: flex; flex-wrap: wrap; gap: 8px; }
.era { border: 2px solid var(--gold); border-radius: 12px; padding: 4px 10px; font-size: 13px; font-weight: 900; background: var(--gold-l); color: var(--ink); box-shadow: 0 2px 0 var(--gold-d); }
.era small { font-weight: 800; color: var(--ink-2); margin-left: 4px; }
.leaders { margin: 4px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.leaders div { border: 2px solid var(--line); border-radius: 16px; padding: 9px 12px; }
.leaders dt { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 900; }
.leaders dd { margin: 2px 0 0; font-weight: 900; font-size: 15px; line-height: 1.25; }
.leaders small { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); font-weight: 800; }
.story-toggle { justify-self: center; }

/* ---- learn / find: the big coloured card ---- */
.hero { border-radius: 22px; padding: 18px; color: #fff; background: var(--hc); box-shadow: 0 5px 0 var(--hd); display: grid; gap: 12px; }
.hero.green { --hc: var(--green); --hd: var(--green-d); }
.hero.blue { --hc: var(--blue); --hd: var(--blue-d); }
.hero .h-top { display: flex; gap: 12px; align-items: center; }
.hero .h-ic { font-size: 34px; line-height: 1; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, .2); flex: none; }
.hero small { display: block; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.hero b { display: block; font-weight: 900; font-size: 22px; line-height: 1.1; }
.hero .h-bar { height: 12px; border-radius: 6px; background: rgba(0, 0, 0, .14); overflow: hidden; }
.hero .h-bar i { display: block; height: 100%; border-radius: 6px; background: #fff; min-width: 12px; }
.hero .h-count { font-size: 14px; font-weight: 800; opacity: .95; margin-top: -6px; }
.hero .btn { background: #fff; border-color: #fff; color: var(--hc); box-shadow: 0 4px 0 rgba(0, 0, 0, .18); margin: 2px 0 2px; }
.hero .h-change { align-self: start; border: 2px solid rgba(255, 255, 255, .6); background: transparent; color: #fff; border-radius: 12px; padding: 5px 10px; font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; flex: none; }
.hero .h-change:active { background: rgba(255, 255, 255, .2); }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat3 { border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px 9px; text-align: center; }
.stat3 b { display: block; font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--c); line-height: 1.1; }
.stat3 span { font-size: 11px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* ---- timeline ---- */
.chapters { display: grid; gap: 12px; }
.chapters .sec { margin: 10px 0 -2px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--sc) 70%, var(--ink)); display: flex; align-items: center; gap: 8px; }
.chapters .sec::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.chapters .sec:first-child { margin-top: 0; }
.chapter { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; text-align: left; }
.chapter .yr { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-weight: 900; font-size: 11px; line-height: 1.1; background: var(--surface); color: var(--ink-2); border: 2px solid var(--line); font-variant-numeric: tabular-nums; white-space: pre-line; }
.chapter .yr { background: color-mix(in srgb, var(--sc) 16%, var(--bg)); border-color: var(--sc); color: color-mix(in srgb, var(--sc) 62%, var(--ink)); }
.chapter b { display: block; font-weight: 900; font-size: 16px; line-height: 1.2; }
.chapter small { color: var(--ink-2); font-size: 13px; font-weight: 800; }
.chapter .ic { width: 18px; height: 18px; color: var(--ink-3); }
.era-head { display: grid; gap: 4px; }
.era-head .yrs { font-size: 13px; color: color-mix(in srgb, var(--sc, var(--gold)) 70%, var(--ink)); font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.era-head h2 { font-weight: 900; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.era-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.era-nav .btn { min-height: 46px; width: 52px; padding: 0; color: var(--ink-2); }
.era-count { font-size: 14px; color: var(--ink-2); text-align: center; font-weight: 800; }
.era-sum h4 { margin: 0 0 4px; font-size: 13px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.era-intro { margin: 0; color: var(--ink-2); font-size: 15px; }
.mtabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px 2px 4px; }
.mtabs::-webkit-scrollbar { display: none; }
.mtabs button { flex: none; border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 900; color: var(--ink-2); box-shadow: 0 3px 0 var(--line); }
.mtabs button:active { transform: translateY(3px); box-shadow: none; }
.mtabs button[aria-selected="true"] { border-color: var(--sc, var(--gold)); background: color-mix(in srgb, var(--sc, var(--gold)) 18%, var(--bg)); color: var(--ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--sc, var(--gold)) 80%, #000); }
.hmap { display: grid; gap: 10px; border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
.hmap h3 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.2; }
.hmap > p { margin: 0; }
.lk { border: 0; padding: 0 1px; background: none; font: inherit; color: var(--blue-d); font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--blue) 45%, transparent); cursor: pointer; }
.legend { display: grid; gap: 6px; }
.grp { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 12px; color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.grp:active { transform: translateY(3px); box-shadow: none; }
.grp.on { border-color: var(--blue); box-shadow: 0 3px 0 #84d8ff; }
.grp i { width: 22px; height: 22px; border-radius: 7px; background: var(--gc); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); }
.grp b { display: block; font-size: 15px; font-weight: 900; line-height: 1.2; }
.grp small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 800; line-height: 1.25; }
.grp em { font-style: normal; font-size: 13px; font-weight: 900; color: var(--ink-3); }
.lrow { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 4px 14px; font-size: 15px; }
.lrow i { height: 5px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--gc) 0 7px, transparent 7px 11px); }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 6px; }
.lk.chip { text-decoration: none; border: 2px solid var(--line); border-radius: 10px; padding: 3px 9px; font-size: 13px; color: var(--ink); background: var(--surface); }
.lk.chip.part { border-style: dashed; color: var(--ink-2); }
.fine { margin: 0; font-size: 12px; color: var(--ink-3); font-weight: 800; }
.hnote { display: grid; gap: 6px; background: var(--surface); border-radius: 14px; padding: 12px; }
.hnote p { margin: 0; }
.role { display: flex; gap: 8px; align-items: baseline; font-weight: 900; }
.role i { flex: none; width: 12px; height: 12px; border-radius: 4px; transform: translateY(1px); }
.hpin { display: flex; align-items: center; gap: 5px; border: 0; background: none; padding: 0; font: 800 12px var(--font); color: #1d3640; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; cursor: pointer; }
.hpin i { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2.5px solid #1d3640; flex: none; }
.picked { border-top: 2px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
.back { display: flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--blue); font-size: 14px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 4px 0; justify-self: start; }
.back .ic { width: 18px; height: 18px; }

/* ---- quiz ---- */
.qhead { display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: center; }
.qx { border: 0; background: none; width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink-3); padding: 0; }
.qx .ic { width: 24px; height: 24px; }
.qbar { height: 16px; border-radius: 8px; background: var(--line); overflow: hidden; }
.qbar i { display: block; height: 100%; border-radius: 8px; background: var(--green); min-width: 16px; position: relative; transition: width .5s var(--ease); }
.qbar i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .3); }
.pill { justify-self: start; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--purple-d); display: flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
.pill.type { color: var(--blue-d); }
.pill.loc { color: var(--orange); }
.prompt { font-weight: 900; font-size: 24px; line-height: 1.2; margin: -6px 0 0; text-wrap: balance; }
.prompt em { font-style: normal; color: var(--blue); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--bg); border-radius: 16px; padding: 12px; font-size: 16px; font-weight: 800; min-height: 60px; text-align: left; line-height: 1.2; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, border-color .15s, background-color .15s; margin-bottom: 4px; }
.opt:active { transform: translateY(4px); box-shadow: none; }
.opt kbd { font: 900 13px var(--font); color: var(--ink-3); border: 2px solid var(--line); border-radius: 8px; width: 26px; height: 26px; display: grid; place-items: center; flex: none; }
.opt.good { border-color: var(--green); background: var(--green-l); color: var(--green-d); box-shadow: 0 4px 0 var(--green); }
.opt.good kbd { border-color: var(--green); color: var(--green-d); }
.opt.bad { border-color: var(--red); background: var(--red-l); color: var(--red-d); box-shadow: 0 4px 0 var(--red); animation: shake .36s; }
.opt.bad kbd { border-color: var(--red); color: var(--red-d); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.good):not(.bad) { opacity: .55; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.typerow { display: flex; gap: 10px; }
.typerow input { flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 800; padding: 12px 15px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); -webkit-user-select: text; user-select: text; }
.typerow input:focus { border-color: var(--blue); background: var(--bg); outline: none; }
.typerow .btn { flex: none; margin-bottom: 4px; }
.fb { margin: 0; font-size: 16px; min-height: 1.3em; }
.fb:empty { display: none; }
.fb.note { color: var(--ink-2); font-weight: 800; }
.fb.bad.note { color: var(--red-d); }
/* The verdict banner: green or red, pinned to the bottom of the panel with the Continue button. */
.verdict { position: sticky; bottom: -16px; margin: 4px -16px -16px; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; gap: 12px; z-index: 2; animation: slide .3s var(--ease); }
body:not(.in-round) .verdict { padding-bottom: 14px; }
.verdict.good { background: var(--green-l); color: var(--green-d); }
.verdict.bad { background: var(--red-l); color: var(--red-d); }
.verdict .v-head { display: flex; gap: 12px; align-items: center; }
.verdict .v-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; flex: none; }
.verdict .v-ic .ic { width: 26px; height: 26px; }
.verdict b { display: block; font-weight: 900; font-size: 21px; line-height: 1.15; }
.verdict span { display: block; font-weight: 800; font-size: 15px; }
.verdict .btn { margin: 0 0 4px; }
.verdict.bad .btn { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-d); }
@keyframes slide { from { transform: translateY(24px); opacity: 0; } }
#nextBtn { position: relative; overflow: hidden; }
#nextBtn .count { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .55); animation: count var(--dur, 2s) linear forwards; }
@keyframes count { from { width: 0; } to { width: 100%; } }

/* Round summary */
.done { display: grid; justify-items: center; text-align: center; gap: 6px; padding-top: 4px; }
.done .badge { width: 92px; height: 92px; animation: pop .6s var(--ease); }
.done .badge svg { width: 100%; height: 100%; }
.done .title { color: var(--gold-d); font-size: 28px; }
.done .sub { color: var(--ink-2); font-weight: 800; }
@keyframes pop { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.08) rotate(3deg); } }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.sum > div { border: 2px solid var(--c); border-radius: 16px; overflow: hidden; background: var(--c); }
.sum span { display: block; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #fff; padding: 4px 2px 3px; }

<script>
window.__start = () => {
'use strict';
const G = window.GEO;
const $ = s => document.querySelector(s);
const sheet = $('#sheet'), wrapEl = $('#mapwrap');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- data ----------
const F = G.features;
const byId = {};
for (const f of F) {
  byId[f.id] = f;
  f.sub1 = f.k === 's' || f.k === 'p' || f.k === 'r' || /^(US|CA|CN)-/.test(f.id);
}

const SCOPES = [
  { id: 'world', name: 'World', unit: 'Countries', icon: '🌍', group: 'Countries', test: f => f.k === 'c' },
  { id: 'Africa', name: 'Africa', unit: 'Countries', icon: '🌍', group: 'Countries', test: f => f.k === 'c' && f.co.includes('Africa') },
  { id: 'Asia', name: 'Asia', unit: 'Countries', icon: '🌏', group: 'Countries', test: f => f.k === 'c' && f.co.includes('Asia') },
  { id: 'Europe', name: 'Europe', unit: 'Countries', icon: '🌍', group: 'Countries', test: f => f.k === 'c' && f.co.includes('Europe') },
  { id: 'North America', name: 'North America', unit: 'Countries', icon: '🌎', group: 'Countries', test: f => f.k === 'c' && f.co.includes('North America') },
  { id: 'South America', name: 'South America', unit: 'Countries', icon: '🌎', group: 'Countries', test: f => f.k === 'c' && f.co.includes('South America') },
  { id: 'Oceania', name: 'Oceania', unit: 'Countries', icon: '🌏', group: 'Countries', test: f => f.k === 'c' && f.co.includes('Oceania') },
  { id: 'usca', name: 'US + Canada', icon: '🗺️', group: 'States and provinces', unit: 'States & provinces', one: 'state or province', sub: true, test: f => f.k === 's' || f.k === 'p' },
  { id: 'us', name: 'US states', icon: '🇺🇸', group: 'States and provinces', unit: 'States', one: 'state', sub: true, test: f => f.k === 's' },
  { id: 'ca', name: 'Canada', icon: '🇨🇦', group: 'States and provinces', unit: 'Provinces & territories', one: 'province or territory', sub: true, test: f => f.k === 'p' },
  { id: 'cn', name: 'China', icon: '🇨🇳', group: 'States and provinces', unit: 'Provinces & regions', one: 'province or region', sub: true, test: f => f.k === 'r' },
  { id: 'oceans', name: 'Oceans', icon: '🌊', group: 'Oceans', unit: 'Oceans', one: 'ocean', noCap: true, test: f => f.k === 'o' },
];
// Countries that sub-national scopes replace with their states, provinces or regions.
const SPLIT = ['USA', 'CAN', 'CHN'];
for (const s of SCOPES) s.items = F.filter(s.test);

// ---------- storage ----------
const KEY = 'atlas-drill:v1';
let store = { prog: {}, scope: 'world', subj: 'name' };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const pkey = (id, subj = state.subj) => subj + ':' + id;
const prog = (id, subj) => store.prog[pkey(id, subj)] || { s: 0, c: 0, w: 0, t: 0 };
function setProg(id, p) { store.prog[pkey(id)] = p; save(); }

// ---------- state ----------
const state = {
  scope: SCOPES.find(s => s.id === store.scope) || SCOPES[0],
  subj: store.subj === 'cap' ? 'cap' : 'name',
  tab: 'explore',    // explore | learn | find | history
  mode: 'explore',   // explore | learn | locate | summary | era
  era: null,         // chapter shown in era mode
  sel: null,         // explore selection
  target: null,      // quiz target feature
  flash: null,       // {id, color, label, until}
  solved: new Set(), // answered this session (labels them on the map)
};
if (state.scope.noCap) state.subj = 'name';

// ==== MAP ENGINE: start (globe) ====
// A true 3D globe drawn by MapLibre GL (globe projection), so every country keeps its real shape and
// relative size. Underneath: Esri's official basemap tiles (ArcGIS Online) when they can load, else
// plain land shapes. On top: Natural Earth 1:10m countries and states for highlighting and tapping.
const TILES_ON = window.ATLAS_TILES !== false;
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const ESRI_ATTR = 'Map &copy; <a href="https://www.esri.com">Esri</a>, GEBCO, Garmin, Maxar';
const NE_ATTR = 'Borders: <a href="https://www.naturalearthdata.com">Natural Earth</a> · Country facts: <a href="https://github.com/mledoze/countries">mledoze/countries</a> (ODbL), <a href="https://www.wikidata.org">Wikidata</a>';
const raster = (path, maxzoom) => ({ type: 'raster', tiles: [ESRI + path + '/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, maxzoom, attribution: ESRI_ATTR });

const decodeRing = ring => {
  const out = []; let x = 0, y = 0;
  for (let i = 0; i < ring.length; i += 2) { x += ring[i]; y += ring[i + 1]; out.push([x / 1000, y / 1000]); }
  return out;
};
const places = { type: 'FeatureCollection', features: [] };
const borders = { type: 'FeatureCollection', features: [] };
// Outline rings as lines, leaving out edges along the 180° meridian where Natural Earth cuts
// Russia and Fiji in two: those are not real borders.
const outline = rings => {
  const lines = [];
  for (const r of rings) {
    let cur = [r[0]];
    for (let i = 1; i < r.length; i++) {
      if (Math.abs(r[i][0]) === 180 && Math.abs(r[i - 1][0]) === 180) { if (cur.length > 1) lines.push(cur); cur = [r[i]]; }
      else cur.push(r[i]);
    }
    if (cur.length > 1) lines.push(cur);
  }
  return lines;
};
const dots = { type: 'FeatureCollection', features: [] };
// Oceans and seas live in their own source, drawn under the land.
const seas = { type: 'FeatureCollection', features: [] };
const SEAS = F.filter(f => f.k === 'o');
for (const f of F) {
  f.size = Math.max(f.f[2] - f.f[0], f.f[3] - f.f[1], 0.01);
  f.ll = [f.l[0] > 180 ? f.l[0] - 360 : f.l[0], f.l[1]];
  if (f.k === 'o') {
    seas.features.push({ type: 'Feature', properties: { id: f.id }, geometry: { type: 'MultiPolygon', coordinates: f.g.map(p => p.map(decodeRing)) } });
    delete f.g; continue;
  }
  if (f.g.length) {
    const coords = f.g.map(p => p.map(decodeRing));
    places.features.push({ type: 'Feature', properties: { id: f.id, sub1: f.sub1 }, geometry: { type: 'MultiPolygon', coordinates: coords } });
    borders.features.push({ type: 'Feature', properties: { id: f.id, sub1: f.sub1 }, geometry: { type: 'MultiLineString', coordinates: outline(coords.flat()) } });
  }
  dots.features.push({ type: 'Feature', properties: { id: f.id, sub1: f.sub1 }, geometry: { type: 'Point', coordinates: f.ll } });
  delete f.g;
}

const SEA_LAYERS = [
  { id: 'sea', type: 'fill', source: 'seas', paint: {
    'fill-color': ['coalesce', ['feature-state', 'fill'], '#2a6f97'],
    'fill-opacity': ['coalesce', ['feature-state', 'fo'], 0] } },
  { id: 'sea-line', type: 'line', source: 'seas', layout: { 'line-join': 'round' }, paint: {
    'line-color': ['coalesce', ['feature-state', 'lc'], '#ffffff'],
    'line-opacity': ['coalesce', ['feature-state', 'lo'], 0],
    'line-width': ['coalesce', ['feature-state', 'lw'], 1],
    'line-dasharray': [2, 2] } },
];
const style = {
  version: 8,
  projection: { type: 'globe' },
  sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] },
  sources: {

// ---------- tabs ----------
function setTab(t) {
  state.tab = t;
  for (const b of document.querySelectorAll('#tabs [data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === t));
}
function showTab(t) {
  clearTimeout(advanceT); keyHandler = null;
  setRound(false);
  if (t !== 'history') state.era = null;
  setTab(t);
  if (t === 'learn') learnSheet(); else if (t === 'find') findSheet(); else if (t === 'history') historySheet(); else homeSheet();
}
// Quiz rounds take the whole panel: the tab bar slides away until the round ends.
function setRound(on) {

  document.body.classList.toggle('in-round', on);
}
document.querySelectorAll('#tabs [data-tab]').forEach(b => b.onclick = () => { buzz(5); showTab(b.dataset.tab); });

// ---------- choosing what to learn ----------

  fitBox(G.views[s.id]); updateTop(); draw();
}
function openPicker() {

    ${groups.map(g => `<div class="label grp-t">${esc(g)}</div><div class="scopes">${SCOPES.filter(s => s.group === g).map(s => {
      state.subj = s.noCap ? 'name' : subj;

      return `<button class="scope tile" data-scope="${esc(s.id)}" aria-pressed="${s === state.scope}"><span class="s-ic">${s.icon}</span><span><b>${esc(s.name)}</b><small>${c.m} of ${c.t} ${esc((s.noCap || subj === 'name' ? s.unit : 'capitals').toLowerCase())}</small></span><span class="mini"><i style="width:${c.t ? Math.max(c.m / c.t * 100, c.m ? 8 : 0) : 0}%"></i></span></button>`;

    if (s !== state.scope) { setScope(s); toast(s.name); }
    if (state.mode === 'learn' || state.mode === 'locate' || state.mode === 'summary') showTab(state.tab);

$('#scopeBtn').onclick = () => { buzz(5); openPicker(); };
$('#ringBtn').onclick = () => { buzz(5); showTab('learn'); };

// Pick the scope a place is drawn in (a state needs the US layer, the USA needs the world layer).
function scopeFor(f) {
  if (f.k === 'o') return state.scope;
  if (f.sub1 && !subMode()) return SCOPES.find(s => s.id === (f.k === 'p' ? 'ca' : f.k === 'r' ? 'cn' : 'us'));
  if (!f.sub1 && subMode() && SPLIT.includes(f.id)) return SCOPES[0];
  if (f.sub1 && subMode() && !state.scope.test(f) && !(f.id === 'US-DC' && state.scope.id.startsWith('us'))) return SCOPES.find(s => s.id === (f.k === 'p' ? 'ca' : f.k === 'r' ? 'cn' : 'us'));
  return state.scope;
}
function selectPlace(f, fly) {
  const s = scopeFor(f);
  if (s !== state.scope) setScope(s);
  state.sel = f;
  if (fly) fitBox(contextBox(f));
  if (state.mode === 'era') eraSheet(state.era, true); else homeSheet();
}

// ---------- explore ----------
const kindLabel = f => f.k === 'o' ? f.sub : f.k === 't' ? 'Territory' : f.sub || '';
const flagOf = f => f.fl || (f.k === 'o' ? '🌊' : f.k === 's' ? '🇺🇸' : f.k === 'p' ? '🇨🇦' : f.k === 'r' ? '🇨🇳' : '📍');
const SEARCHABLE = F.filter(f => f.id !== 'ATA');
function searchPlaces(q) {
  const x = norm(q); if (!x) return [];
  const hits = [];
  for (const f of SEARCHABLE) {
    const names = [f.n, ...f.al].map(norm);
    const rank = names[0].startsWith(x) ? 0 : names.some(n => n.startsWith(x)) ? 1 : names.some(n => n.includes(x)) ? 2 : (x.length > 3 && f.cap.some(c => norm(c).startsWith(x))) ? 3 : -1;
    if (rank >= 0) hits.push([rank, f]);
  }
  return hits.sort((a, b) => a[0] - b[0] || a[1].n.localeCompare(b[1].n)).slice(0, 8).map(h => h[1]);
}
function placeCard(sel) {
  const quizzable = sel.k !== 't';
  const st = s => s >= 2 ? 's2' : s === 1 ? 's1' : '';
  const word = s => s >= 2 ? 'Mastered' : s === 1 ? 'Learning' : 'New';
  const pn = prog(sel.id, 'name').s, pc = prog(sel.id, 'cap').s;
  const facts = [
    sel.cap[0] && ['Capital', sel.cap[0]],
    sel.pop && ['Population', fmt(sel.pop)],
    sel.ar >= 1 && ['Area', fmt(sel.ar) + ' km²'],
  ].filter(Boolean);
  return `<div class="place"><span class="flag${sel.k === 'o' ? ' sea' : ''}" aria-hidden="true">${flagOf(sel)}</span><h2>${esc(sel.n)}</h2><button class="x" id="unsel" aria-label="Close">${IC.x}</button><span class="sub">${esc(kindLabel(sel))}</span></div>
    ${facts.length ? `<div class="facts">${facts.map(([k, v]) => `<div class="fact"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
    ${quizzable ? `<div class="status"><span class="${st(pn)}">Name · ${word(pn)}</span>${sel.cap[0] ? `<span class="${st(pc)}">Capital · ${word(pc)}</span>` : ''}</div>` : `<p class="hint">A territory: shown on the globe, not in the quiz.</p>`}
    ${storyHtml(sel)}`;
}
// The Explore home: a place of the day, and the three ways to learn.
function placeOfDay() {
  const pool = F.filter(f => f.k === 'c' && f.h).sort((a, b) => a.id.localeCompare(b.id));
  let h = 0; for (const ch of dayKey()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return pool[h % pool.length];
}
function startHtml() {
  const d = placeOfDay(), first = d ? d.h.t.split(/(?<=\.)\s/)[0] : '';
  const go = (tab, ic, c, t, sub) => `<button class="go tile" data-go="${tab}" style="--c:${c}"><span class="go-ic">${ic}</span><span><b>${t}</b><small>${sub}</small></span>${IC.next}</button>`;
  return `${d ? `<h4 class="home-h">Place of the day</h4><button class="pod tile" data-pod="${d.id}"><span class="flag">${flagOf(d)}</span><span><b>${esc(d.n)}</b><small>${esc(first)}</small></span></button>` : ''}
    <h4 class="home-h">Ways to learn</h4>
    ${go('learn', IC.cap, 'var(--green)', 'Learn the map', 'Name every country, capital, state and province')}
    ${go('find', IC.pin, 'var(--orange)', 'Find it on the globe', 'We name a place, you tap it')}
    ${go('history', IC.clock, 'var(--purple)', 'Travel through time', `${trackList("world").length} chapters, from the first cities to today`)}`;
}
function homeSheet() {
  state.mode = 'explore'; state.target = null; state.solved.clear();
  setRound(false); setTab('explore');
  const sel = state.sel;
  setSheet(`
    <div class="search" id="searchBox">${IC.search}<input id="q" type="search" placeholder="Search countries, states, oceans" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search places"><button class="clear" id="qClear" aria-label="Clear search">${IC.x}</button></div>
    <div class="results" id="results" hidden></div>
    <div id="exploreBody" style="display:grid;gap:14px">
      ${sel ? placeCard(sel) : `<div class="empty"><span class="em-ic">${ART.globe}</span><b>Tap any place on the globe</b><p>Countries, states and oceans. Green means you've learned it.</p></div>
        <button class="btn" id="surprise">${IC.shuffle}Surprise me</button>${startHtml()}`}
    </div>`);
  const q = $('#q'), res = $('#results'), body = $('#exploreBody'), box = $('#searchBox');
  q.oninput = () => {
    const hits = searchPlaces(q.value);
    box.classList.toggle('has-text', !!q.value);
    res.hidden = !q.value; body.hidden = !!q.value;
    res.innerHTML = hits.length ? hits.map(f => `<button class="result tile" data-id="${f.id}"><span class="r-fl">${flagOf(f)}</span><span><b>${esc(f.n)}</b><small>${esc(kindLabel(f))}</small></span></button>`).join('') : `<p class="hint" style="padding:8px 4px">No places match “${esc(q.value)}”.</p>`;
    res.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { buzz(5); q.blur(); selectPlace(byId[b.dataset.id], true); });
  };
  q.onkeydown = e => { if (e.key === 'Enter') { const first = res.querySelector('[data-id]'); if (first) first.click(); } };
  $('#qClear').onclick = () => { q.value = ''; q.oninput(); q.focus(); };
  if ($('#surprise')) $('#surprise').onclick = () => { buzz(8); const pool = state.scope.items.filter(f => f.h || f.k === 'o'); selectPlace(pool[Math.random() * pool.length | 0], true); };
  if ($('#unsel')) $('#unsel').onclick = () => { state.sel = null; homeSheet(); draw(); };
  sheet.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { buzz(5); showTab(b.dataset.go); });
  sheet.querySelectorAll('[data-pod]').forEach(b => b.onclick = () => { buzz(5); selectPlace(byId[b.dataset.pod], true); });
  bindEras();
  updateTop(); draw();
}

// ---------- timeline ----------

function eraSheet(id, keepView, mapI) {

    <div class="era-nav"><button class="btn" id="eraPrev" aria-label="Previous chapter" ${i ? '' : 'disabled'}>${IC.back}</button>
      <span class="era-count">${M ? 'Tap a lit country for its part in the story.' : members.length ? `${members.length} ${kind} lit up. Tap one for its story.` : `No ${kind} in this view belong to this chapter.`}</span>

  if (hq) bindHQ(id);
  sheet.querySelectorAll('.mtabs [data-m]').forEach(b => b.onclick = () => { buzz(5); eraSheet(id, false, +b.dataset.m); });
  sheet.querySelectorAll('.grp').forEach(b => b.onclick = () => { buzz(5); state.focusG = state.focusG === +b.dataset.g ? null : +b.dataset.g; eraSheet(id, true); });
  sheet.querySelectorAll('.lk[data-id]').forEach(b => b.onclick = () => { buzz(5); const f = byId[b.dataset.id]; state.sel = f; eraSheet(id, true); showOnGlobe(f); });
  bindEras();
  // A newly picked country: bring its card into view.
  if (sel && sel !== state.shownSel) { const pk = $('#picked'); if (pk) requestAnimationFrame(() => sheet.scrollTo({ top: sheet.scrollTop + pk.getBoundingClientRect().top - sheet.getBoundingClientRect().top - 12, behavior: 'smooth' })); }
  state.shownSel = sel;
  if (!keepView) {
    if (M) fitBox(M.box || mapBox(M));
    else {
      // Frame the chapter's places; if they span the globe, show the whole scope.
      const b = members.reduce((t, f) => [Math.min(t[0], f.f[0]), Math.min(t[1], f.f[1]), Math.max(t[2], f.f[2]), Math.max(t[3], f.f[3])], [Infinity, Infinity, -Infinity, -Infinity]);
      fitBox(members.length && b[2] - b[0] < 150 ? [b[0] - 4, b[1] - 3, b[2] + 4, b[3] + 3] : G.views[state.scope.id]);
    }
  }
  draw();
}
// Frame a chapter map: its countries, lines and pins, or the whole world if they span it.
function mapBox(M) {
  const pts = [];
  for (const g of M.groups) for (const id of [...(g.full || []), ...(g.part || [])]) { const f = byId[id]; if (f && id !== 'RUS' && id !== 'USA' && id !== 'CAN') pts.push([f.f[0], f.f[1]], [f.f[2], f.f[3]]); }
  for (const l of M.lines || []) pts.push(...l.pts);
  for (const p of M.pins || []) pts.push(p.l);
  if (!pts.length) return G.views.world;
  const b = [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
  return b[2] - b[0] > 150 ? G.views.world : [b[0] - 3, b[1] - 3, b[2] + 3, b[3] + 3];
}
// Map quiz: five lit places from the current map; name the group each belongs to. Places with a
// note come first, since those are the ones the map is about.
function hquizPool(M) {
  const ids = [];
  for (const g of M.groups) for (const c of [...(g.full || []), ...(g.part || [])]) if (byId[c] && LAYER.includes(byId[c])) ids.push(c);
  return M.groups.length >= 2 ? ids : [];
}
function startHQ(M) {
  const pool = shuffle(hquizPool(M)), noted = pool.filter(c => M.notes && M.notes[c]);
  const q = [...noted, ...pool.filter(c => !noted.includes(c))].slice(0, 5);
  state.hq = { M, q: shuffle(q), i: 0, picked: null, right: 0 };
  state.sel = null; state.focusG = null;
}
function hquizHtml(hq) {
  const M = hq.M;
  if (hq.i >= hq.q.length) return `<div class="hmap hq"><div class="done"><span class="badge">${hq.right >= 4 ? ART.trophy : ART.medal}</span><div class="title">${hq.right} of ${hq.q.length} right</div><div class="sub">${esc(M.title)}</div></div>
    <button class="btn primary" id="hqAgain">Quiz me again</button><button class="btn" id="hqEnd">Back to the map</button></div>`;
  const f = byId[hq.q[hq.i]], r = histRole(f);
  const opts = M.groups.map((g, gi) => {
    const cls = hq.picked == null ? '' : gi === r.gi ? ' right' : gi === hq.picked ? ' wrong' : ' dim';
    return `<button class="opt hopt${cls}" data-g="${gi}" ${hq.picked == null ? '' : 'disabled'}><i style="background:${PAL[g.color]}"></i><span>${esc(g.label)}</span></button>`;
  }).join('');
  const note = M.notes && M.notes[f.id];
  const after = hq.picked == null ? '' : `<div class="verdict ${hq.picked === r.gi ? 'good' : 'bad'}"><div class="v-head"><span class="v-ic">${hq.picked === r.gi ? IC.check : IC.cross}</span><div><b>${hq.picked === r.gi ? 'Right!' : `Answer: ${esc(M.groups[r.gi].label)}`}</b>${note ? `<span>${esc(note)}</span>` : ''}</div></div>
    <button class="btn primary" id="hqNext">${hq.i + 1 < hq.q.length ? 'Next' : 'See score'}</button></div>`;
  return `<div class="hmap hq"><div class="qhead"><button class="qx" id="hqEnd" aria-label="End quiz">${IC.x}</button><div class="qbar"><i style="width:${hq.i / hq.q.length * 100}%"></i></div></div>
    <span class="pill">Map quiz · ${esc(M.tab)}</span>
    <p class="prompt">${r.part ? `Part of today's <em>${esc(f.n)}</em> belonged to which?` : `Which group was <em>${esc(f.n)}</em> in?`}</p>
    <div class="opts">${opts}</div>${after}</div>`;
}
function bindHQ(id) {
  const hq = state.hq;
  sheet.querySelectorAll('.hopt').forEach(b => b.onclick = () => {
    const r = histRole(byId[hq.q[hq.i]]); hq.picked = +b.dataset.g;
    if (hq.picked === r.gi) { hq.right++; buzz(12); } else buzz([30, 40, 30]);
    eraSheet(id, true);
  });
  if ($('#hqNext')) $('#hqNext').onclick = () => { hq.i++; hq.picked = null; eraSheet(id, true); const f = byId[hq.q[hq.i]]; if (f) showOnGlobe(f); };
  if ($('#hqAgain')) $('#hqAgain').onclick = () => { startHQ(hq.M); eraSheet(id, true); showOnGlobe(byId[state.hq.q[0]]); };
  sheet.querySelectorAll('#hqEnd').forEach(b => b.onclick = () => { state.hq = null; eraSheet(id, true); });
  if (hq.i === 0 && hq.picked == null) showOnGlobe(byId[hq.q[0]]);
  // Keep the quiz itself in view, under the chapter title.
  const box = sheet.querySelector('.hq'), sr = sheet.getBoundingClientRect();
  if (box) sheet.scrollTop += box.getBoundingClientRect().top - sr.top - 12;
  // After an answer, make sure the explanation and Next button are on screen too.
  const v = sheet.querySelector('.hq .verdict'); if (v) { const over = v.getBoundingClientRect().bottom - sr.bottom + 16; if (over > 0) sheet.scrollTop += over; }
}
// Turn the globe to a country (keeping the zoom) if it is out of view.
function showOnGlobe(f) {
  if (!f) return;
  const p = map.project(f.ll), r = wrapEl.getBoundingClientRect(), P = pads();
  const inView = p.x > P.left && p.x < r.width - P.right && p.y > P.top && p.y < r.height - P.bottom && map.getBounds().contains(f.ll);
  if (!inView) map.easeTo({ center: f.ll, duration: 700, padding: P });
}

function onPick(f) {
  if (state.mode === 'locate') return locateTap(f);
  if (state.mode === 'learn') {
    // During a question, tapping only names places outside the quiz or already solved.
    if (f && (!inScope(f) || state.solved.has(f.id))) toast(f.n);
    else if (f && state.target && f.id !== state.target.id) toast('Answer first, then explore');
    return;
  }
  if (state.mode === 'summary') return;
  const pick = f && f.id !== 'ATA' ? f : null;
  if (pick) { buzz(5); toast(pick.n); }
  if (state.mode === 'era') { state.sel = pick && !anchorById[state.era].track && byId[parentId(pick)] || pick; return eraSheet(state.era, true); }
  state.sel = pick;
  homeSheet();
}

// ---------- learn session ----------
let session = null, roundFrom = 'learn';
function startLearn() {
  const items = quizItems();
  const learning = items.filter(f => prog(f.id).s === 1).sort((a, b) => prog(a.id).t - prog(b.id).t);
  const fresh = items.filter(f => prog(f.id).s === 0);
  const q = [];
  for (const f of learning.slice(0, 4)) q.push({ f, kind: 'type' });
  // New items come as a geographic cluster around the selection or the map centre.
  if (fresh.length) {
    const c = viewCenter();
    const seed = state.sel && fresh.includes(state.sel) ? state.sel
      : fresh.reduce((a, b) => Math.hypot(a.l[0] - c.x, a.l[1] - c.y) <= Math.hypot(b.l[0] - c.x, b.l[1] - c.y) ? a : b);
    const take = Math.max(0, 7 - Math.min(learning.length, 4) + (learning.length ? 0 : 1));
    const cluster = fresh.slice().sort((a, b) => dist(a, seed) - dist(b, seed)).slice(0, Math.max(take, 4));
    for (const f of cluster) q.push({ f, kind: 'mc' });
  }
  if (q.length < 6) {
    const mastered = shuffle(items.filter(f => prog(f.id).s >= 2)).sort((a, b) => prog(b.id).w - prog(a.id).w);
    for (const f of mastered.slice(0, 10 - q.length)) q.push({ f, kind: 'type' });
  }
  // Interleave so reviews don't all come first.
  const mcs = q.filter(x => x.kind === 'mc'), rest = q.filter(x => x.kind !== 'mc');
  const queue = [];
  while (mcs.length || rest.length) { if (mcs.length) queue.push(mcs.shift()); if (mcs.length) queue.push(mcs.shift()); if (rest.length) queue.push(rest.shift()); }
  session = { queue, done: 0, first: new Map(), mastered: 0, total: queue.length };
  roundFrom = 'learn';
  state.mode = 'learn'; state.locate = false; state.sel = null; state.solved.clear();
  setRound(true);
  nextQ();
}
function requeue(item, gap) { session.queue.splice(Math.min(gap, session.queue.length), 0, item); session.total++; }
function nextQ() {
  clearTimeout(advanceT);
  if (!session.queue.length) return summary();
  const item = session.queue.shift();
  session.cur = item;
  state.target = item.f; state.flash = null;
  fitBox(contextBox(item.f));
  if (item.kind === 'mc') askMC(item); else askType(item);
}
function qhead(kind) {
  const label = kind === 'mc' ? 'Pick one' : kind === 'type' ? 'Type it' : 'Find it';
  const total = session.done + session.queue.length + 1;
  return `<div class="qhead"><button class="qx" id="quit" aria-label="End round">${IC.x}</button><div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${session.done}"><i style="width:${session.done / total * 100}%"></i></div></div>
    <span class="pill ${kind}">${label === 'Pick one' ? 'New place' : label === 'Type it' ? 'Type the answer' : `Find it · ${session.done + 1} of ${total}`}</span>`;
}
function promptFor(f) {
  if (state.subj === 'cap') return `What is the capital of <em>${esc(f.n)}</em>?`;
  return `Which ${state.scope.one || 'country'} is highlighted?`;
}
function bindQuit() { $('#quit').onclick = () => { session.queue = []; summary(); }; }
function askMC(item) {
  const f = item.f;
  const pool = quizItems().filter(x => x !== f && shown(x) !== shown(f) && shown(x) !== '—');
  const near = pool.slice().sort((a, b) => dist(a, f) - dist(b, f));
  const picks = shuffle(near.slice(0, 6)).slice(0, 2);
  const others = shuffle(pool.filter(x => !picks.includes(x))).slice(0, 3 - picks.length);
  const opts = shuffle([f, ...picks, ...others]);
  setSheet(`${qhead('mc')}<p class="prompt">${promptFor(f)}</p>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-id="${o.id}"><kbd>${i + 1}</kbd><span>${esc(shown(o))}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>`);
  bindQuit();
  const btns = [...sheet.querySelectorAll('.opt')];
  const pick = b => {
    if (b.disabled) return;
    btns.forEach(x => x.disabled = true);
    const chosen = byId[b.dataset.id];
    const ok = chosen === f;
    btns.find(x => x.dataset.id === f.id).classList.add('good');
    if (!ok) {
      b.classList.add('bad');
      flashPlace(chosen, state.subj === 'cap' ? chosen.cap[0] + ' (' + chosen.n + ')' : chosen.n);
    }
    answered(item, ok, false);
  };
  btns.forEach(b => b.onclick = () => pick(b));
  keyHandler = e => { const n = +e.key; if (n >= 1 && n <= btns.length) pick(btns[n - 1]); };
}
function askType(item) {
  const f = item.f;
  setSheet(`${qhead('type')}<p class="prompt">${promptFor(f)}</p>
    <form class="typerow" id="tf" autocomplete="off"><input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" data-form-type="other" name="quiz-guess" placeholder="${state.subj === 'cap' ? 'Type the capital' : 'Type your answer'}" aria-label="Your answer"><button class="btn primary" type="submit">Check</button></form>
    <div class="row"><button class="btn" id="hintBtn">First letter</button><button class="btn" id="idk">Show me</button></div>
    <div class="fb" id="fb"></div>`);
  bindQuit();
  const input = $('#ans');
  setTimeout(() => input.focus({ preventScroll: true }), 50);
  let hinted = false;
  $('#tf').onsubmit = e => {
    e.preventDefault();
    if (!input.value.trim()) return;
    const g = grade(input.value, f);
    if (g) { lock(); answered(item, true, hinted, g === 'close' ? `Close enough: ${shown(f)}` : null); return; }
    const other = state.subj === 'name' ? matchOther(input.value, f) : state.scope.items.find(x => x !== f && x.cap.some(c => norm(c) === norm(input.value)));
    if (other) flashPlace(other, state.subj === 'cap' ? other.cap[0] + ' (' + other.n + ')' : other.n);
    lock(); answered(item, false, hinted, null, input.value);
  };
  $('#hintBtn').onclick = () => { hinted = true; const a = shown(f); input.value = a[0]; input.focus(); $('#hintBtn').disabled = true; };
  $('#idk').onclick = () => { lock(); answered(item, false, hinted); };
  function lock() { input.readOnly = true; input.blur(); sheet.querySelectorAll('.typerow button, .row button').forEach(b => b.disabled = true); }
}
function flashPlace(f, label) {
  if (!f) return;
  state.flash = { id: f.id, color: C.bad, label, until: performance.now() + 4000 };
  draw();
}
const PRAISE = ['Nicely done!', 'Great job!', 'Correct!', 'You got it!', 'Excellent!', 'Spot on!'];
// The verdict banner at the foot of the panel: what happened, and the button to move on.
function verdict(ok, title, detail) {
  const fb = $('#fb');
  fb.className = 'verdict ' + (ok ? 'good' : 'bad');
  fb.innerHTML = `<div class="v-head"><span class="v-ic">${ok ? IC.check : IC.cross}</span><div><b>${title}</b>${detail ? `<span>${detail}</span>` : ''}</div></div>`;
  return fb;
}
function answered(item, ok, hinted, note, typed) {
  const f = item.f, p = { ...prog(f.id) };
  const firstTry = !session.first.has(f.id);
  if (firstTry) session.first.set(f.id, ok && !hinted);
  p.t = Date.now();
  let fb;
  if (ok) {
    p.c++;
    if (item.kind === 'mc') { p.s = Math.max(p.s, 1); requeue({ f, kind: 'type' }, 3); }
    else if (!hinted) { if (p.s < 2) session.mastered++; p.s = 2; }
    else requeue({ f, kind: 'type' }, 3);
    state.solved.add(f.id);
    const detail = note ? esc(note) : state.subj === 'cap' ? `The capital of ${esc(f.n)}` : f.cap[0] ? `Capital: ${esc(f.cap[0])}` : '';
    fb = verdict(true, PRAISE[Math.random() * PRAISE.length | 0], detail);
    buzz(12);
  } else {
    p.w++;
    if (item.kind === 'type') p.s = Math.min(p.s, 1);
    requeue({ f, kind: item.kind === 'mc' ? 'mc' : (p.s === 0 ? 'mc' : 'type') }, 3);
    fb = verdict(false, 'Correct answer:', `<span style="font-size:19px;font-weight:900">${esc(shown(f))}</span>` + (typed && state.flash && state.flash.until > performance.now() ? `${esc(typed)} is marked in red on the globe` : ''));
    buzz([20, 40, 20]);
  }
  practisedToday();
  setProg(f.id, p); updateTop();
  session.done++;
  const bar = sheet.querySelector('.qbar i'); if (bar) bar.style.width = (session.done / (session.done + session.queue.length) * 100) + '%';
  draw();
  const next = (auto) => {
    const b = document.createElement('button'); b.className = 'btn primary'; b.id = 'nextBtn';
    b.innerHTML = `Continue${auto ? `<span class="count" style="--dur:${auto}ms"></span>` : ''}`;
    b.onclick = nextQ; fb.append(b); setTimeout(() => b.focus({ preventScroll: true }), 30);
    keyHandler = e => { if (e.key === 'Enter') { e.preventDefault(); nextQ(); } };
    return b;
  };
  if (ok) {
    // Keep drilling fast: move on automatically unless they stop to read the story.
    const ms = item.kind === 'mc' ? 2000 : 2200;
    advanceT = setTimeout(nextQ, ms);
    const b = next(ms);
    if (f.h) {
      const t = document.createElement('button'); t.className = 'link story-toggle'; t.textContent = 'Read its story';
      t.onclick = () => { clearTimeout(advanceT); t.remove(); b.innerHTML = 'Continue'; fb.insertAdjacentHTML('beforebegin', storyHtml(f, false)); };
      fb.before(t);
    }
  } else {
    next();
    fb.insertAdjacentHTML('beforebegin', storyHtml(f, false));
  }
}
let advanceT = null, keyHandler = null;
document.addEventListener('keydown', e => {
  if (!keyHandler || e.target.tagName === 'INPUT' && !e.target.readOnly) return;
  const h = keyHandler; if (e.key === 'Enter' || /^[1-4]$/.test(e.key)) { keyHandler = null; h(e); }
});
function summary() {
  clearTimeout(advanceT); keyHandler = null;
  state.mode = 'summary'; state.target = null; state.flash = null;
  const firstRight = [...session.first.values()].filter(Boolean).length, n = session.first.size;
  const great = n && firstRight / n >= 0.8;
  setSheet(`<div class="done"><span class="badge">${great ? ART.trophy : ART.medal}</span><div class="title">${!n ? 'Round ended' : great ? 'Round complete!' : 'Good practice!'}</div><div class="sub">${scopeLine()}</div></div>
    <div class="sum"><div style="--c:var(--green)"><span>First try</span><b>${IC.target}${n ? Math.round(firstRight / n * 100) : 0}%</b></div><div style="--c:var(--blue)"><span>${state.locate ? 'Found' : 'Mastered'}</span><b>${IC.crown}${session.mastered}</b></div><div style="--c:var(--orange)"><span>Streak</span><b>${IC.flame}${streak()}</b></div></div>
    <button class="btn primary" id="again">Keep going</button>
    <button class="btn" id="home">Done</button>`);
  buzz(great ? [10, 60, 10] : 10);
  $('#again').onclick = () => state.locate ? startLocate() : startLearn();
  $('#home').onclick = () => { state.locate = false; showTab(roundFrom); };
  setRound(true);
  fitBox(G.views[state.scope.id]);
  draw();
}

// ---------- find-on-map session ----------
function startLocate() {
  const items = quizItems();
  const key = id => 'loc-' + state.subj + ':' + id;
  // Every place in the set, in random order.
  const pick = shuffle(items.slice());
  session = { queue: pick.map(f => ({ f, kind: 'loc' })), done: 0, first: new Map(), mastered: 0, total: pick.length, key };
  roundFrom = 'find';
  state.mode = 'locate'; state.locate = true; state.sel = null; state.solved.clear();
  setRound(true);
  nextLoc();
}
function nextLoc() {
  if (!session.queue.length) { state.mode = 'summary'; return summary(); }
  const item = session.queue.shift();
  session.cur = item; session.tries = 0;
  state.target = null; state.flash = null; state.findTarget = item.f;
  const f = item.f;
  const q = state.subj === 'cap' ? `Which ${state.scope.one || 'country'} has the capital <em>${esc(f.cap[0])}</em>?` : `Find <em>${esc(f.n)}</em>`;
  setSheet(`${qhead('loc')}<p class="prompt">${q}</p><div class="fb note" id="fb">Spin the globe and tap it. Pinch to zoom in on small places.</div>
    <div class="row"><button class="btn" id="giveup">Show me</button></div>`);
  bindQuit();
  $('#giveup').onclick = () => locateReveal(false);
  fitBox(G.views[state.scope.id]);
}
function locateTap(f) {
  if (!session || !session.cur || state.target) return;
  const t = session.cur.f;
  if (!f) return;
  if (f === t) return locateReveal(true);
  session.tries++;
  flashPlace(f, f.n);
  buzz([20, 40, 20]);
  const fb = $('#fb'); fb.className = 'fb note bad'; fb.innerHTML = `That's ${esc(f.n)}. ${session.tries < 3 ? `${3 - session.tries} ${session.tries === 2 ? 'try' : 'tries'} left.` : ''}`;
  if (session.tries >= 3) locateReveal(false);
}
function locateReveal(ok) {
  const f = session.cur.f;
  const first = ok && session.tries === 0;
  session.first.set(f.id, first);
  if (first) { if (!store.prog[session.key(f.id)]) session.mastered++; store.prog[session.key(f.id)] = 1; save(); }
  state.target = f; state.solved.add(f.id); session.done++;
  practisedToday(); updateTop();
  const fb = ok ? verdict(true, PRAISE[Math.random() * PRAISE.length | 0], `That's ${esc(f.n)}` + (f.cap[0] ? ` · capital ${esc(f.cap[0])}` : '')) : verdict(false, `${esc(f.n)} is here`, 'Look where it sits on the globe.');
  if (ok) buzz(12);
  const bar = sheet.querySelector('.qbar i'); if (bar) bar.style.width = (session.done / (session.done + session.queue.length) * 100) + '%';
  const gb = $('#giveup'); if (gb) gb.closest('.row').remove();
  fitBox(contextBox(f));
  const b = document.createElement('button'); b.className = 'btn primary'; b.id = 'nextBtn'; b.textContent = 'Continue'; b.onclick = nextLoc; fb.append(b);
  fb.insertAdjacentHTML('beforebegin', storyHtml(f, false));
  keyHandler = e => { if (e.key === 'Enter') { e.preventDefault(); nextLoc(); } };
  draw();
}

// ---------- boot ----------
window.__atlas = { state, byId, map };
readColors();
refreshLayer();
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', () => { resize(); window.scrollTo(0, 0); });
window.visualViewport?.addEventListener('scroll', fitViewport);
// First layout without animation, so the globe starts centred in the space above the panel.
$('#app').classList.add('dragging');
homeSheet();
resize();
map.resize();
fitBox(G.views[state.scope.id], 0);
requestAnimationFrame(() => requestAnimationFrame(() => $('#app').classList.remove('dragging')));
// Launch screen: hold it until the globe has drawn (briefly, at most a few seconds).
const splashStart = performance.now();
const hideSplash = () => setTimeout(() => $('#splash').classList.add('gone'), Math.max(0, 900 - (performance.now() - splashStart)));
if (reduceMotion) $('#splash').classList.add('gone');
else { map.once('idle', hideSplash); setTimeout(hideSplash, 4000); }
};
</script>

<script>
fetch('geo-live.json').then(r => r.json()).then(g => { window.GEO = g; setTimeout(window.__start); },
  () => { document.getElementById('sheet').textContent = 'Could not load the map data. Check your connection and reload.'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
