      : `<p class="hint">No one has scored yet this week. Answer a few questions and you'll be first.</p>`;
  }, () => { if ($('#lb')) $('#lb').innerHTML = '<p class="hint">Couldn\'t load the leaderboard. Check your connection.</p>'; });
}

// Races: a four-letter code, the same ten places for everyone, four choices each, 15 seconds a question.
// A right answer earns 500 points plus up to 500 for speed, and the first right answer gets 250 more.
const RACE_N = 10, RACE_T = 15000, RACE_COLORS = ['red', 'blue', 'gold', 'green'];
let race = null;
function raceQuestions() {
  const pool = shuffle(state.scope.items.filter(f => f.n)).slice(0, RACE_N);
  return pool.map(f => {
    const near = state.scope.items.filter(x => x !== f && x.n).sort((a, b) => dist(a, f) - dist(b, f));
    const opts = shuffle([f, ...shuffle(near.slice(0, 6)).slice(0, 3)]);
    return { id: f.id, opts: opts.map(o => o.id), a: opts.indexOf(f) };
  });
}
function raceHost() {
  if (state.scope.items.length < 8) return toast('Pick a bigger set to race on');
  CLOUD.createRace({ scope: state.scope.id, title: state.scope.name, qs: raceQuestions() }).then(raceOpen, () => toast('Couldn\'t start a race. Check your connection.'));
}
function raceJoin(code) {
  if (!/^[A-Z0-9]{4}$/.test(code)) { const e = $('#raceErr'); if (e) e.textContent = 'Codes are four letters or numbers.'; return; }
  CLOUD.joinRace(code).then(() => raceOpen(code), e => { const el = $('#raceErr'); if (el) el.textContent = e.message; else toast(e.message); });
}
function joinFromLink() {
  const code = new URLSearchParams(location.search).get('race');
  if (!code || state.race) return;
  if (!ME) return $('#siForm, #gsiBtn, [data-sso]') ? undefined : signInSheet({ then: () => joinFromLink(), invite: code.toUpperCase() });
  history.replaceState(null, '', location.pathname);
  showTab('compete'); raceJoin(code.toUpperCase());
}
function raceOpen(code) {
  race = { code, room: null, answered: -1, revealed: -1, timer: null };
  state.race = code;
  setRound(true); setTab('compete'); draw();
  race.unsub = CLOUD.watchRace(code, room => { race.room = room; raceRender(); });
}
function raceLeave() {
  if (!race) return;
  clearInterval(race.timer); clearTimeout(race.next); race.unsub && race.unsub();
  if (race.room && race.room.host === CLOUD.myId()) CLOUD.endRace(race.code); else CLOUD.leave(race.code);
  race = null; state.race = null; state.target = null; keyHandler = null;
  competeSheet();
}
const racePlayers = room => Object.entries(room.players || {}).filter(([, p]) => !p.gone).map(([uid, p]) => ({ uid, ...p }));
function raceRender() {
  // A deleted room means the host left; after the podium there's nothing to interrupt.
  const room = race && race.room; if (!room) { if (race && !race.ended) { toast('The race has ended'); raceLeave(); } return; }
  const isHost = room.host === CLOUD.myId(), players = racePlayers(room).sort((a, b) => b.score - a.score);
  // The host's device runs the race; if it drops out mid-race, nobody can move on, so end it kindly.
  // The host's device runs the race. If it goes quiet (phone locked, app closed), the other players take
  // over in turn: the first a couple of seconds after a step was due, the next a little later, and so on.
  // Before the start there is nothing to take over, so a host who leaves the lobby ends it.
  if (!isHost && room.state === 'lobby' && (room.players || {})[room.host] && room.players[room.host].gone) { toast('The host left, so the race has ended'); return raceLeave(); }
  const backups = racePlayers(room).filter(p => p.uid !== room.host).map(p => p.uid).sort();
  const myTurn = isHost ? 0 : 2500 * (backups.indexOf(CLOUD.myId()) + 1);
  if (room.scope && state.scope.id !== room.scope) setScope(SCOPES.find(x => x.id === room.scope) || state.scope);
  clearInterval(race.timer);
  if (room.state === 'lobby') {
    const link = `${location.origin}${location.pathname}?race=${race.code}`;
    setSheet(`<div class="qhead"><button class="qx" id="rcX" aria-label="Leave">${IC.x}</button><span class="pill">Race · ${esc(room.title || '')}</span></div>
      <div class="rc-code"><small>Race code</small><b>${race.code}</b><button class="btn" id="rcShare">Invite a friend</button></div>
      ${isHost ? `<button class="btn primary" id="rcGo" ${players.length < 2 ? 'disabled' : ''}>${players.length < 2 ? 'Waiting for a friend to join…' : 'Start the race'}</button>` : '<p class="hint" style="text-align:center">Waiting for the host to start…</p>'}
      <h4 class="home-h">${players.length} ${players.length === 1 ? 'player' : 'players'}</h4>
      <div class="lb">${players.map(p => `<div class="lb-row${p.uid === CLOUD.myId() ? ' me' : ''}">${avatar(p.name, p.uid)}<span class="lb-name">${who(p)}${p.uid === room.host ? ' · host' : ''}</span></div>`).join('')}</div>
`);
    $('#rcShare').onclick = () => { const t = `Race me on Meridian! Code ${race.code}`; if (navigator.share) navigator.share({ title: 'Meridian race', text: t, url: link }).catch(() => {}); else navigator.clipboard?.writeText(`${t}: ${link}`).then(() => toast('Invite link copied')); };
    if ($('#rcGo')) $('#rcGo').onclick = () => { buzz(8); CLOUD.startQuestion(race.code, 0); };
  } else if (room.state === 'q') {
    const qi = room.qi, q = room.qs[qi], f = byId[q.id], mine = room.answers && room.answers[qi] && room.answers[qi][CLOUD.myId()];
    if (race.shownQ !== qi) { race.shownQ = qi; state.target = f; state.flash = null; fitBox(contextBox(f)); draw(); buzz(5); }
    setSheet(`<div class="qhead"><button class="qx" id="rcX" aria-label="Leave">${IC.x}</button><div class="qbar rc-time"><i id="rcBar"></i></div></div>
      <span class="pill">Question ${qi + 1} of ${room.qs.length}</span>
      <p class="prompt">${mine ? 'Locked in! Waiting for the others…' : 'Which place is highlighted?'}</p>
      <div class="rc-opts">${q.opts.map((id, k) => `<button class="rc-opt c-${RACE_COLORS[k]}${mine && mine.c === k ? ' picked' : ''}" data-k="${k}" ${mine ? 'disabled' : ''}>${esc(byId[id].n)}</button>`).join('')}</div>`);
    const btns = [...sheet.querySelectorAll('.rc-opt')];
    btns.forEach(b => b.onclick = () => { if (b.disabled) return; buzz(8); btns.forEach(x => x.disabled = true); b.classList.add('picked'); CLOUD.answer(race.code, qi, +b.dataset.k); });
    keyHandler = mine ? null : e => { const n = +e.key; if (n >= 1 && n <= 4) btns[n - 1].click(); };
    const tick = () => {
      const left = Math.max(0, RACE_T - (CLOUD.serverNow() - room.qStart)), bar = $('#rcBar');
      if (bar) bar.style.width = (left / RACE_T * 100) + '%';
      const ans = room.answers && room.answers[qi] || {};
      // Due when time runs out or everyone has answered (the latest answer's time).
      const allIn = players.every(p => ans[p.uid]), dueAt = allIn ? Math.max(...players.map(p => ans[p.uid].t || 0)) : room.qStart + RACE_T;
      if (race.revealed < qi && (left <= 0 || allIn) && CLOUD.serverNow() >= dueAt + myTurn) raceScore(room, qi);
    };
    tick(); race.timer = setInterval(tick, 200);
  } else if (room.state === 'reveal') {
    const qi = room.qi, q = room.qs[qi], ans = room.answers && room.answers[qi] || {}, mine = ans[CLOUD.myId()];
    const right = Object.entries(ans).filter(([, a]) => a.c === q.a).sort((x, y) => x[1].t - y[1].t);
    const first = right[0] && (room.players[right[0][0]] || {}).name;
    const ok = mine && mine.c === q.a;
    if (race.answered !== qi) { race.answered = qi; practisedToday(ok ? 10 : 0); buzz(ok ? 12 : [20, 40, 20]); sfx(ok ? 'right' : 'wrong'); }
    state.solved.add(q.id); draw();
    setSheet(`<div class="qhead"><button class="qx" id="rcX" aria-label="Leave">${IC.x}</button><span class="pill">Question ${qi + 1} of ${room.qs.length}</span></div>
      <div class="verdict ${ok ? 'good' : 'bad'} inline rc-verdict"><div class="v-head"><span class="v-ic">${ok ? IC.check : IC.cross}</span><div><b>${ok ? (right[0] && right[0][0] === CLOUD.myId() ? 'First!' : 'Right!') : `It was ${esc(byId[q.id].n)}`}</b><span>${first ? `${esc(first)} got it first` : 'No one got this one'}</span></div></div></div>
      <div class="lb">${players.map((p, i) => `<div class="lb-row${p.uid === CLOUD.myId() ? ' me' : ''}"><span class="lb-n">${i + 1}</span>${avatar(p.name, p.uid)}<span class="lb-name">${who(p)}</span><b>${p.score}</b></div>`).join('')}</div>`);
    clearTimeout(race.next);
    const advance = () => { if (race && race.room && race.room.state === 'reveal' && race.room.qi === qi) (qi + 1 < room.qs.length ? CLOUD.startQuestion(race.code, qi + 1) : CLOUD.finish(race.code)).catch(() => {}); };
    race.next = setTimeout(advance, Math.max(0, (room.revealAt || CLOUD.serverNow()) + 3500 + myTurn - CLOUD.serverNow()));
  } else if (room.state === 'done') {
    const top = players.slice(0, 3), meRank = players.findIndex(p => p.uid === CLOUD.myId()) + 1;
    if (race.ended !== true) { race.ended = true; buzz(meRank === 1 ? [10, 60, 10] : 10); }
    setSheet(`<div class="done"><span class="badge">${meRank === 1 ? ART.trophy : ART.medal}</span><div class="title">${meRank === 1 ? 'You won!' : `You came ${['', 'first', 'second', 'third'][meRank] || meRank + 'th'}`}</div><div class="sub">Race · ${esc(room.title || '')}</div></div>
      <div class="podium">${top.map((p, i) => `<div class="pod-${i + 1}">${avatar(p.name, p.uid)}<b>${esc(p.name)}</b><span>${p.score}</span></div>`).join('')}</div>
      ${isHost ? '<button class="btn primary" id="rcAgain">Race again</button>' : ''}<button class="btn" id="rcDone">Done</button>`);
    if ($('#rcAgain')) $('#rcAgain').onclick = () => { const code = race.code; raceLeave(); raceHost(); };
    $('#rcDone').onclick = raceLeave;
  }
  if ($('#rcX')) $('#rcX').onclick = raceLeave;
}
// The host scores each question from the server timestamps, then shows the answer to everyone.
function raceScore(room, qi) {
  race.revealed = qi;
  const q = room.qs[qi], ans = room.answers && room.answers[qi] || {};
  const right = Object.entries(ans).filter(([, a]) => a.c === q.a).sort((x, y) => x[1].t - y[1].t);
  const scores = {};
  right.forEach(([uid, a], i) => {
    const speed = Math.max(0, 1 - (a.t - room.qStart) / RACE_T);
    scores[uid] = ((room.players[uid] || {}).score || 0) + 500 + Math.round(500 * speed) + (i === 0 ? 250 : 0);
  });
  CLOUD.reveal(race.code, scores).catch(() => {});  // a stand-in can be refused under older rules; the host still moves on
}

window.__atlas = { state, byId, map };
readColors();
refreshLayer();
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', () => { resize(); window.scrollTo(0, 0); });
window.visualViewport?.addEventListener('scroll', fitViewport);
// First layout without animation, so the globe starts centred in the space above the panel.
$('#app').classList.add('dragging');
if (needsOnboarding()) onboarding(); else homeSheet();
resize();
map.resize();
fitBox(G.views[state.scope.id], 0);
requestAnimationFrame(() => requestAnimationFrame(() => $('#app').classList.remove('dragging')));
// Launch screen: hold it until the globe has drawn (briefly, at most a few seconds).
const splashStart = performance.now();
const hideSplash = () => setTimeout(() => $('#splash').classList.add('gone'), Math.max(0, 900 - (performance.now() - splashStart)));
if (reduceMotion) $('#splash').classList.add('gone');
else { map.once('idle', hideSplash); setTimeout(hideSplash, 4000); }
};
